[build]
  command = "npm run build"
  publish = ".output/public"
  functions = "netlify/functions"

[build.environment]
  NITRO_PRESET = "cloudflare-module"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
